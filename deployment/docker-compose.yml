version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-strongpassword}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=aichatagent;Username=postgres;Password=yourpassword
      - OPENAI__APIKEY=${OPENAI_API_KEY}
      - GEMINI__APIKEY=${GEMINI_API_KEY}
      - CHATPROVIDER=Gemini
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-strongpassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=aichatagent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data: